<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Space Exploration Quiz</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1c2233;
    --muted: #5d6680;
    --border: #dfe3ee;
    --accent: #5b5bf0;
    --accent-2: #a855f7;
    --correct: #16a34a;
    --correct-bg: #dcfce7;
    --wrong: #dc2626;
    --wrong-bg: #fee2e2;
    --shadow: 0 10px 30px rgba(28, 34, 51, 0.08);
    --hud-bg: #eef1f9;
    --hud-grid: rgba(91, 91, 240, 0.07);
    --hud-edge: #c9cfe3;
    --hud-glow: transparent;
    --standby: #b45309;
    --btn-text: #ffffff;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f1e;
      --card: #151a2e;
      --text: #e7eaf6;
      --muted: #9aa3c0;
      --border: #262d4a;
      --accent: #818cf8;
      --accent-2: #c084fc;
      --correct: #4ade80;
      --correct-bg: rgba(74, 222, 128, 0.14);
      --wrong: #f87171;
      --wrong-bg: rgba(248, 113, 113, 0.14);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      --hud-bg: #0a0e1c;
      --hud-grid: rgba(129, 140, 248, 0.08);
      --hud-edge: #2c3560;
      --hud-glow: rgba(129, 140, 248, 0.18);
      --standby: #fbbf24;
      --btn-text: #0b0f1e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background:
      radial-gradient(circle at 20% 10%, rgba(129, 140, 248, 0.15), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(192, 132, 252, 0.15), transparent 40%),
      var(--bg);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 440px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .hud {
    position: relative;
    margin-bottom: 20px;
    padding: 12px 14px 14px;
    border: 1px solid var(--hud-edge);
    border-radius: 10px;
    background:
      linear-gradient(var(--hud-grid) 1px, transparent 1px) 0 0 / 100% 8px,
      var(--hud-bg);
    box-shadow: inset 0 0 0 1px var(--hud-glow), 0 0 18px var(--hud-glow);
    font-family: var(--mono);
    overflow: hidden;
  }
  .hud::before, .hud::after {
    content: ""; position: absolute; width: 10px; height: 10px;
    border-color: var(--accent); border-style: solid; opacity: 0.8;
  }
  .hud::before { top: 4px; left: 4px; border-width: 2px 0 0 2px; }
  .hud::after { bottom: 4px; right: 4px; border-width: 0 2px 2px 0; }
  .hud-row {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px;
    margin-bottom: 10px;
  }
  .hud-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hud-cell.right { text-align: right; align-items: flex-end; }
  .hud-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
  }
  .hud-value {
    font-size: 20px; font-weight: 700; line-height: 1.1; color: var(--text);
    font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
  }
  .hud-value .dim { color: var(--muted); font-weight: 500; font-size: 14px; }
  .score { display: inline-block; transition: transform 0.25s, color 0.25s; }
  .score.bump { transform: scale(1.18); color: var(--correct); }
  .hud-status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid currentColor;
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--standby);
    white-space: nowrap;
  }
  .hud-status.ok { color: var(--correct); }
  .hud-status.err { color: var(--wrong); }
  .led {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 6px currentColor;
    animation: blink 1.2s steps(2, start) infinite;
  }
  .hud-status.ok .led, .hud-status.err .led { animation: none; }
  .segments {
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px;
  }
  .seg {
    height: 10px; border-radius: 2px;
    background: var(--border);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .seg.current { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .seg.correct { background: var(--correct); box-shadow: 0 0 6px var(--correct); }
  .seg.wrong { background: var(--wrong); box-shadow: 0 0 6px var(--wrong); }
  .progress {
    height: 8px; border-radius: 999px; background: var(--border);
    overflow: hidden;
  }
  .progress > div {
    height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: inherit;
    transition: width 0.4s ease;
  }
  .question { font-size: 17px; font-weight: 600; margin: 0 0 16px; }
  .options { display: grid; gap: 10px; }
  .option {
    font: inherit; text-align: left; color: var(--text);
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .option:hover:not(:disabled),
  .option:focus-visible { border-color: var(--accent); transform: translateY(-1px); }
  .option:focus-visible {
    outline: 2px solid transparent;
    box-shadow: 0 0 0 2px var(--card), 0 0 0 5px var(--accent);
    background: var(--hud-bg);
  }
  .option:focus-visible .key { background: var(--accent); color: #fff; border-color: var(--accent); }
  .option:disabled { cursor: default; }
  .option .key {
    flex: none; width: 24px; height: 24px; border-radius: 6px;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 600;
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
  }
  .option.correct {
    border-color: var(--correct); background: var(--correct-bg);
    animation: pop 0.4s ease;
  }
  .option.correct .key { background: var(--correct); color: #fff; border-color: var(--correct); }
  .option.wrong {
    border-color: var(--wrong); background: var(--wrong-bg);
    animation: shake 0.45s ease;
  }
  .option.wrong .key { background: var(--wrong); color: #fff; border-color: var(--wrong); }
  .option.dim { opacity: 0.55; }

  .feedback {
    min-height: 24px; margin: 16px 0 0; font-size: 14px; font-weight: 600;
    opacity: 0; transform: translateY(4px);
    transition: opacity 0.25s, transform 0.25s;
  }
  .feedback.show { opacity: 1; transform: none; }
  .feedback.good { color: var(--correct); }
  .feedback.bad { color: var(--wrong); }
  .feedback small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }

  .btn {
    font: inherit; font-weight: 600; color: var(--btn-text);
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border: 0; border-radius: 10px; padding: 12px 18px;
    width: 100%; margin-top: 16px; cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible {
    outline: 2px solid transparent;
    box-shadow: 0 0 0 2px var(--card), 0 0 0 5px var(--accent), 0 0 16px var(--accent);
    filter: brightness(1.08);
  }
  .btn[hidden] { display: none; }
  .hint { margin: 12px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
  kbd {
    font-family: var(--mono); font-size: 12px;
    padding: 1px 5px; border-radius: 4px;
    border: 1px solid var(--border); border-bottom-width: 2px;
    background: var(--bg); color: var(--text);
  }
  @media (forced-colors: active) {
    .option:focus-visible, .btn:focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
  }

  .results { text-align: center; }
  .results .emoji { font-size: 72px; line-height: 1; display: inline-block; animation: bounceIn 0.7s cubic-bezier(.2,1.4,.4,1); }
  .results h2 { margin: 12px 0 4px; font-size: 22px; }
  .results .big { font-size: 40px; font-weight: 700; margin: 8px 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .results p { color: var(--muted); margin: 0; }
  .review { margin-top: 24px; text-align: left; }
  .review h3 { margin: 0 0 12px; font-size: 17px; }
  .review-list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .review-item {
    padding: 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--hud-bg);
  }
  .review-item p { margin: 0; }
  .review-question { font-weight: 600; color: var(--text) !important; }
  .review-answer { margin-top: 6px !important; color: var(--correct) !important; }
  .review-fact { margin-top: 6px !important; }

  .fade-in { animation: fadeIn 0.35s ease; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); box-shadow: 0 0 0 6px var(--correct-bg); }
    100% { transform: scale(1); }
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes bounceIn { 0% { transform: scale(0) rotate(-20deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes blink { to { opacity: 0.25; } }
  @keyframes pulse { 50% { opacity: 0.45; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>🚀 Space Exploration Quiz</h1>
    <p>10 questions about our journey to the stars</p>
  </header>

  <section class="card" id="quiz" aria-live="polite">
    <div class="hud" id="hud" role="group" aria-label="Mission status">
      <div class="hud-row">
        <div class="hud-cell">
          <span class="hud-label">Question</span>
          <span class="hud-value" id="counter">01<span class="dim"> / 10</span></span>
        </div>
        <div class="hud-status" id="status"><span class="led" aria-hidden="true"></span><span id="status-text">Awaiting input</span></div>
        <div class="hud-cell right">
          <span class="hud-label">Score</span>
          <span class="hud-value"><span class="score" id="score">00</span></span>
        </div>
      </div>
      <div class="segments" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress"></div>
    </div>
    <div id="body">
      <p class="question" id="question"></p>
      <div class="options" id="options" role="group" aria-labelledby="question"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn" id="next" hidden>Next question</button>
      <p class="hint" id="hint">Press <kbd>1</kbd>–<kbd>4</kbd> or <kbd>A</kbd>–<kbd>D</kbd> to answer · <kbd>↑</kbd><kbd>↓</kbd> to move · <kbd>Enter</kbd> to continue</p>
    </div>
    <div id="results" hidden></div>
  </section>
</main>

<script>
  const QUESTIONS = [
    { q: "Who was the first human to travel into space?", a: ["Neil Armstrong", "Yuri Gagarin", "John Glenn", "Alan Shepard"], c: 1,
      fact: "Yuri Gagarin orbited Earth aboard Vostok 1 on April 12, 1961." },
    { q: "Which mission first landed humans on the Moon?", a: ["Apollo 8", "Apollo 11", "Apollo 13", "Gemini 4"], c: 1,
      fact: "Apollo 11 landed on July 20, 1969." },
    { q: "What was the first artificial satellite launched into orbit?", a: ["Explorer 1", "Vanguard 1", "Sputnik 1", "Telstar"], c: 2,
      fact: "The USSR launched Sputnik 1 on October 4, 1957." },
    { q: "Which planet has the tallest volcano in the solar system, Olympus Mons?", a: ["Venus", "Mars", "Io (moon)", "Mercury"], c: 1,
      fact: "Olympus Mons on Mars is about 22 km high — nearly 2.5× Everest." },
    { q: "Which spacecraft is the farthest human-made object from Earth?", a: ["Voyager 1", "Pioneer 10", "New Horizons", "Voyager 2"], c: 0,
      fact: "Voyager 1 entered interstellar space in 2012." },
    { q: "Which telescope launched in 2021 observes primarily in infrared?", a: ["Hubble", "Spitzer", "Kepler", "James Webb"], c: 3,
      fact: "JWST orbits near the Sun–Earth L2 point, ~1.5 million km away." },
    { q: "What is the name of NASA's helicopter that flew on Mars?", a: ["Curiosity", "Ingenuity", "Dragonfly", "Perseverance"], c: 1,
      fact: "Ingenuity made the first powered flight on another planet in 2021." },
    { q: "Who was the first woman to travel into space?", a: ["Sally Ride", "Valentina Tereshkova", "Mae Jemison", "Svetlana Savitskaya"], c: 1,
      fact: "Valentina Tereshkova flew Vostok 6 in June 1963." },
    { q: "Roughly how fast does the International Space Station orbit Earth?", a: ["~1,000 km/h", "~8,000 km/h", "~28,000 km/h", "~100,000 km/h"], c: 2,
      fact: "The ISS circles Earth about every 90 minutes." },
    { q: "Which NASA mission flew past Pluto in 2015?", a: ["New Horizons", "Cassini", "Juno", "Dawn"], c: 0,
      fact: "New Horizons gave us the first close-up images of Pluto's heart-shaped plain." },
  ];

  const $ = (id) => document.getElementById(id);
  const shuffle = (items, previous = []) => {
    const shuffled = [...items];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    if (shuffled.length > 1 && shuffled.every((item, i) => item === previous[i])) {
      [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
    }
    return shuffled;
  };
  let questions = shuffle(QUESTIONS);
  let index = 0, score = 0, answered = false;
  let missedQuestions = [];
  const pad = (n) => String(n).padStart(2, "0");
  const BEST_SCORE_KEY = "space-exploration-quiz-best-score";

  function getBestScore() {
    try {
      const best = Number(window.localStorage.getItem(BEST_SCORE_KEY));
      return Number.isInteger(best) && best >= 0 && best <= QUESTIONS.length ? best : 0;
    } catch (error) {
      console.warn("Unable to read the personal best score from browser storage.", error);
      return 0;
    }
  }

  function saveBestScore(best) {
    try {
      window.localStorage.setItem(BEST_SCORE_KEY, String(best));
    } catch (error) {
      console.warn("Unable to save the personal best score to browser storage.", error);
    }
  }

  const segments = questions.map(() => {
    const s = document.createElement("div");
    s.className = "seg";
    $("progress").appendChild(s);
    return s;
  });

  function setStatus(kind, text) {
    $("status").className = "hud-status" + (kind ? ` ${kind}` : "");
    $("status-text").textContent = text;
  }

  function render(focusFirst) {
    const item = questions[index];
    answered = false;
    $("counter").innerHTML = `${pad(index + 1)}<span class="dim"> / ${questions.length}</span>`;
    segments[index].classList.add("current");
    setStatus("", "Awaiting input");
    $("question").textContent = item.q;
    const opts = $("options");
    opts.innerHTML = "";
    item.a.forEach((text, i) => {
      const b = document.createElement("button");
      b.className = "option";
      b.innerHTML = `<span class="key" aria-hidden="true">${"ABCD"[i]}</span><span></span>`;
      b.lastChild.textContent = text;
      b.setAttribute("aria-keyshortcuts", `${i + 1} ${"ABCD"[i]}`);
      b.addEventListener("click", () => choose(i));
      opts.appendChild(b);
    });
    const fb = $("feedback");
    fb.className = "feedback";
    fb.innerHTML = "";
    $("next").hidden = true;
    $("body").classList.remove("fade-in");
    void $("body").offsetWidth;
    $("body").classList.add("fade-in");
    if (focusFirst) opts.firstChild.focus();
  }

  function setProgress(done, correct) {
    const seg = segments[done - 1];
    seg.classList.remove("current");
    seg.classList.add(correct ? "correct" : "wrong");
    const p = $("progress");
    p.setAttribute("aria-valuenow", done);
    p.setAttribute("aria-valuetext", `${done} of ${questions.length} answered`);
  }

  function choose(i) {
    if (answered) return;
    answered = true;
    const item = questions[index];
    const buttons = [...$("options").children];
    buttons.forEach((b) => (b.disabled = true));
    const fb = $("feedback");
    if (i === item.c) {
      score++;
      buttons[i].classList.add("correct");
      buttons.forEach((b, j) => j !== i && b.classList.add("dim"));
      fb.className = "feedback good";
      fb.innerHTML = `✅ Correct! <small></small>`;
      const s = $("score");
      s.textContent = pad(score);
      s.classList.add("bump");
      setTimeout(() => s.classList.remove("bump"), 300);
    } else {
      buttons[i].classList.add("wrong");
      buttons[item.c].classList.add("correct");
      buttons.forEach((b, j) => j !== i && j !== item.c && b.classList.add("dim"));
      missedQuestions.push({ question: item.q, answer: item.a[item.c], fact: item.fact });
      fb.className = "feedback bad";
      fb.innerHTML = `❌ Not quite — it's “${item.a[item.c]}”. <small></small>`;
    }
    fb.querySelector("small").textContent = item.fact;
    requestAnimationFrame(() => fb.classList.add("show"));
    const correct = i === item.c;
    setStatus(correct ? "ok" : "err", correct ? "Confirmed" : "Anomaly");
    setProgress(index + 1, correct);
    const next = $("next");
    next.textContent = index === questions.length - 1 ? "See results" : "Next question";
    next.hidden = false;
    next.focus();
  }

  function showResults() {
    const previousBest = getBestScore();
    const bestScore = Math.max(score, previousBest);
    if (bestScore > previousBest) saveBestScore(bestScore);
    const pct = score / questions.length;
    const [emoji, title, msg] =
      pct === 1   ? ["🤩", "Perfect mission!", "You're ready for astronaut training."] :
      pct >= 0.8  ? ["🚀", "Stellar work!", "You really know your space history."] :
      pct >= 0.5  ? ["🙂", "Solid orbit!", "A few more trips around the sun and you'll ace it."] :
      pct >= 0.3  ? ["😅", "Bumpy re-entry", "Time to brush up on your space facts."] :
                    ["😵", "Lost in space", "Houston, we have a problem — try again!"];
    $("hud").hidden = true;
    $("body").hidden = true;
    const res = $("results");
    res.hidden = false;
    res.innerHTML = `
      <div class="results fade-in">
        <div class="emoji" aria-hidden="true">${emoji}</div>
        <h2 id="result-title">${title}</h2>
        <div class="big" id="result-score">${score} / ${questions.length}</div>
        <p id="result-msg">${msg}</p>
        <p id="result-best">Personal best: ${bestScore} / ${QUESTIONS.length}</p>
        <div class="progress" style="margin:20px 0 0" aria-hidden="true"><div style="width:${pct * 100}%"></div></div>
        ${missedQuestions.length ? `<section class="review" aria-labelledby="review-title">
          <h3 id="review-title">Review missed questions (${missedQuestions.length})</h3>
          <ol class="review-list"></ol>
        </section>` : ""}
        <button class="btn" id="restart" aria-describedby="result-title result-score result-msg result-best">Play again</button>
      </div>`;
    const reviewList = res.querySelector(".review-list");
    if (reviewList) {
      missedQuestions.forEach(({ question, answer, fact }) => {
        const entry = document.createElement("li");
        entry.className = "review-item";
        const questionText = document.createElement("p");
        questionText.className = "review-question";
        questionText.textContent = question;
        const answerText = document.createElement("p");
        answerText.className = "review-answer";
        const answerLabel = document.createElement("strong");
        answerLabel.textContent = "Correct answer: ";
        answerText.append(answerLabel, document.createTextNode(answer));
        const factText = document.createElement("p");
        factText.className = "review-fact";
        factText.textContent = fact;
        entry.append(questionText, answerText, factText);
        reviewList.appendChild(entry);
      });
    }
    $("restart").addEventListener("click", restart);
    $("restart").focus();
  }

  function restart() {
    questions = shuffle(QUESTIONS, questions);
    index = 0;
    score = 0;
    missedQuestions = [];
    $("score").textContent = pad(0);
    segments.forEach((s) => (s.className = "seg"));
    const p = $("progress");
    p.setAttribute("aria-valuenow", 0);
    p.removeAttribute("aria-valuetext");
    $("results").hidden = true;
    $("results").innerHTML = "";
    $("hud").hidden = false;
    $("body").hidden = false;
    render(true);
  }

  $("next").addEventListener("click", () => {
    index++;
    if (index < questions.length) render(true);
    else showResults();
  });

  document.addEventListener("keydown", (e) => {
    // A held Enter/Space on "Next" would otherwise auto-repeat onto the newly focused option.
    if (e.repeat && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    if (answered || $("body").hidden) return;
    const buttons = [...$("options").children];
    const n = "1234abcd".indexOf(e.key.toLowerCase());
    if (n >= 0) {
      e.preventDefault();
      choose(n % 4);
      return;
    }
    const pos = buttons.indexOf(document.activeElement);
    const step = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
    if (step) {
      e.preventDefault();
      const target = pos < 0 ? (step > 0 ? 0 : buttons.length - 1) : (pos + step + buttons.length) % buttons.length;
      buttons[target].focus();
    } else if ((e.key === "Home" || e.key === "End") && pos >= 0) {
      e.preventDefault();
      buttons[e.key === "Home" ? 0 : buttons.length - 1].focus();
    }
  });

  render(false);
</script>
</body>
</html>
